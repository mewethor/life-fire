name: Build APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, for example 1.1"
        required: true
        default: "1.0"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set version
        env:
          VER: ${{ inputs.version }}
        run: |
          [[ "$VER" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "Version must look like 1.1"; exit 1; }
          sed -i "s/var V=\"[^\"]*\"/var V=\"$VER\"/" www/index.html
      - name: Signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore; else echo "No signing key secret found"; exit 1; fi
      - run: npm install
      - run: npx cap add android
      - name: Campfire icon (skipped if it fails)
        continue-on-error: true
        run: npx @capacitor/assets generate --android
      - run: npx cap sync android
      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: life-fire-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ inputs.version }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk life-fire.apk
          gh release create "v$VER" life-fire.apk --title "Life Fire $VER" --notes "Life Fire version $VER" --target "$GITHUB_SHA"
